<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ca8d5"/>
      <stop offset="100%" stop-color="#1e4f7e"/>
    </linearGradient>
    <linearGradient id="elBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f8ff"/>
      <stop offset="100%" stop-color="#d6ecf8"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>

  <!-- Left ear (behind head) -->
  <ellipse cx="31" cy="36" rx="12" ry="15" fill="url(#elBody)" opacity="0.8"/>
  <ellipse cx="31" cy="36" rx="7" ry="10" fill="#a8d4f0"/>

  <!-- Trunk -->
  <path d="M38 51 Q29 58 30 70 Q31 76 36 74 Q40 70 39 63 Q38 57 42 52"
        fill="url(#elBody)"/>

  <!-- Body -->
  <ellipse cx="54" cy="67" rx="21" ry="16" fill="url(#elBody)"/>

  <!-- Head -->
  <circle cx="50" cy="38" r="17" fill="url(#elBody)"/>

  <!-- Tusk -->
  <path d="M39 52 Q33 60 33 67" stroke="#fffff0" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eye -->
  <circle cx="57" cy="34" r="4" fill="#1e4f7e"/>
  <circle cx="58.5" cy="32.5" r="1.5" fill="white"/>

  <!-- Head highlight -->
  <ellipse cx="43" cy="29" rx="6" ry="4" fill="white" opacity="0.2"/>

  <!-- Legs -->
  <rect x="37" y="78" width="9" height="13" rx="4.5" fill="url(#elBody)"/>
  <rect x="50" y="78" width="9" height="13" rx="4.5" fill="url(#elBody)"/>

  <!-- Tail -->
  <path d="M73 63 Q83 57 80 49" stroke="url(#elBody)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
